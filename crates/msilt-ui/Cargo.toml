[package]
name = "msilt-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
msilt-core.workspace = true
serde_json.workspace = true
tempfile = "3"
# Slint with the *measured* winner backend: software raster + winit, no GPU
# context, no dGPU wake, 12.6 MiB private / ~118 ms first frame on the
# MS-17S3 test machine. The Fluent 2 widget style comes from `std-widgets`.
slint = { version = "1.19.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "software-renderer-path",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Minimal Win32 surface for the Win11 DWM bridge (Mica / rounded corners /
# dark frame) plus the min-tracking-size and animation-preference queries.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19.1"
