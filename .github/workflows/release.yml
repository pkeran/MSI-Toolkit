name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify tag matches the application version
        shell: pwsh
        run: |
          $workspace = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($workspace.packages | Where-Object name -eq 'msilt-ui').version
          if (-not $version -or $env:RELEASE_TAG -cne "v$version") { throw "Tag $env:RELEASE_TAG does not match msilt-ui $version" }

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run full workspace test suite
        run: cargo test --workspace --locked

      - name: Build & stage release artifacts with SHA256SUMS
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MSI-Toolkit ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/MSI-Toolkit-Setup.exe
            dist/MSI-Toolkit-win64.zip
            dist/SHA256SUMS.txt
